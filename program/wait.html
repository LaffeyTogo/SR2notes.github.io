<!DOCTYPE html>
<html lang="zh">
<script type="module" src="../include/SR2VZnote.js"></script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../include/SR2VZnote.css">
    <title>老狗的RS2文档</title>
</head>
<body>

    <lf-catalogue></lf-catalogue>





    <lf-content>
        <div class="Section">
            <h3>1：wait（）seconds  （等待（）秒）</h3>
            <div class="unit" style="margin-top: 0; margin-bottom: 0;">
                <vizzy-div>
                    <vizzy-instruction>
                        <vizzy-text>wait</vizzy-text>
                        <vizzy-elliptical>
                            <vizzy-text>0</vizzy-text>
                        </vizzy-elliptical>
                        <vizzy-text>seconds</vizzy-text>
                    </vizzy-instruction>
                </vizzy-div>               
                <p>等待一秒并非现实世界的一秒，这存在一点误差，受是设备刷新帧率影响而产生的，并不大但不可忽视，在时空扭矩中会发生极大错误</p>
            </div>
        </div>
    </lf-content>
</body>
</html>
